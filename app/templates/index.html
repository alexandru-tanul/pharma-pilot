{% extends "base.html" %}

{% block content %}
    <div id="landing-page" class="flex-1 flex flex-col relative overflow-hidden">

        <!-- Hero -->
        <div class="flex-1 flex flex-col items-center justify-center text-center px-4 md:px-8 relative z-10">
            <div class="animate-fade-in">
                <!-- Pill badge -->
                <div class="inline-flex items-center gap-2 bg-white/[0.04] border border-white/[0.08] rounded-full px-4 py-1.5 mb-6">
                    <div class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></div>
                    <span class="text-xs text-gray-400 font-medium">AI-Powered Research Assistant</span>
                </div>

                <h1 class="text-4xl md:text-6xl font-bold text-white mb-4 tracking-tight leading-tight">
                    Pharma <span class="bg-gradient-to-r from-emerald-400 via-emerald-300 to-teal-400 bg-clip-text text-transparent">Pilot</span>
                </h1>
                <p class="text-gray-500 text-base md:text-lg mb-8 max-w-lg mx-auto leading-relaxed">
                    Navigate clinical trials, drug targets, and protein biology across three biomedical databases.
                </p>

                <!-- Powered by — colored glowing badges -->
                <div class="flex flex-col items-center gap-3 animate-fade-in-delay-1">
                    <span class="text-gray-700 text-[11px] uppercase tracking-[0.2em] font-medium">Powered by</span>
                    <div class="flex flex-wrap items-center justify-center gap-3">
                        <span class="inline-flex items-center gap-1.5 bg-amber-500/[0.08] border border-amber-500/20 text-amber-400 rounded-full px-4 py-1.5 text-sm font-medium glow-amber">
                            <div class="w-1.5 h-1.5 rounded-full bg-amber-400"></div>
                            DrugCentral
                        </span>
                        <span class="inline-flex items-center gap-1.5 bg-blue-500/[0.08] border border-blue-500/20 text-blue-400 rounded-full px-4 py-1.5 text-sm font-medium glow-blue">
                            <div class="w-1.5 h-1.5 rounded-full bg-blue-400"></div>
                            ClinicalTrials.gov
                        </span>
                        <span class="inline-flex items-center gap-1.5 bg-purple-500/[0.08] border border-purple-500/20 text-purple-400 rounded-full px-4 py-1.5 text-sm font-medium glow-purple">
                            <div class="w-1.5 h-1.5 rounded-full bg-purple-400"></div>
                            Pharos
                        </span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Example Prompts + Input -->
        <div class="w-full max-w-4xl mx-auto flex flex-col gap-4 px-4 pb-6 md:pb-8 relative z-10">
            <!-- Example Queries Grid -->
            <div class="w-full grid grid-cols-2 md:grid-cols-3 gap-2.5 animate-fade-in-delay-2">
                {% for prompt in example_prompts %}
                <button
                    hx-post="/send"
                    hx-vals='{"message": "{{ prompt.message }}"}'
                    hx-swap="none"
                    class="cursor-pointer bg-white/[0.02] border border-white/[0.06] hover:border-emerald-500/40 hover:bg-emerald-500/[0.04] p-4 rounded-xl transition-all duration-300 text-left group hover:shadow-[0_0_30px_rgba(52,211,153,0.06)]"
                >
                    <div class="flex flex-col gap-2">
                        <div class="flex items-center gap-2">
                            <iconify-icon icon="{{ prompt.icon }}" class="{{ prompt.icon_color }} group-hover:text-emerald-400 transition-colors duration-300 flex-shrink-0 text-lg"></iconify-icon>
                            <h3 class="text-sm font-medium text-gray-200 group-hover:text-white transition-colors duration-300">{{ prompt.title }}</h3>
                        </div>
                        <p class="text-xs text-gray-600 group-hover:text-gray-500 line-clamp-2 leading-relaxed transition-colors duration-300">"{{ prompt.message }}"</p>
                    </div>
                </button>
                {% endfor %}
            </div>

            <!-- Input Form -->
            <div class="animate-fade-in-delay-3">
                <form
                    hx-post="/send"
                    hx-swap="none"
                    class="w-full relative"
                >
                    <input
                        name="message"
                        type="text"
                        placeholder="Ask about clinical trials, drugs, or protein targets..."
                        class="w-full bg-white/[0.03] border border-white/[0.08] focus:border-emerald-500/50 focus:bg-white/[0.05] focus:shadow-[0_0_30px_rgba(52,211,153,0.08)] transition-all duration-300 outline-none rounded-xl py-4 pl-5 pr-14 placeholder-gray-600 text-base"
                        required
                    >
                    <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-600 hover:text-emerald-400 bg-white/[0.04] hover:bg-emerald-500/10 p-2 rounded-lg transition-all duration-300 flex items-center justify-center">
                        <iconify-icon icon="mdi:send" class="text-lg"></iconify-icon>
                    </button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
